<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Study timer</title>
<style>
  :root { --fg:#f2f2f2; --dim:#8a8a8a; --line:#2a2a2a; --red:#e5484d; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:#000; color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:30rem; margin:0 auto; display:flex; flex-direction:column; gap:1.75rem;
    padding:calc(2rem + env(safe-area-inset-top)) 1.25rem calc(2.5rem + env(safe-area-inset-bottom)); }
  #time { font-size:clamp(3.5rem,19vw,6rem); font-weight:200; text-align:center;
    font-variant-numeric:tabular-nums; letter-spacing:.02em; line-height:1; }
  button, input { font:inherit; color:var(--fg); }
  button { cursor:pointer; background:transparent; border:1px solid #555; border-radius:999px; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
  #toggle { width:100%; padding:1rem; font-size:1.2rem; }
  #toggle.start { background:var(--fg); color:#000; border-color:var(--fg); }
  #toggle.stop { border-color:var(--red); color:var(--red); }
  #chips { display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center; }
  .chip { padding:.45rem 1rem; font-size:.95rem; }
  .chip.on { background:var(--fg); color:#000; border-color:var(--fg); }
  .chip:disabled:not(.on) { opacity:.3; }
  .chip.on:disabled { opacity:1; }
  .add { display:flex; gap:.5rem; }
  .add input { flex:1; min-width:0; background:#000; border:1px solid var(--line); border-radius:.6rem; padding:.5rem .8rem; }
  .add button { padding:.5rem 1rem; }
  .link { border:0; color:var(--dim); font-size:.85rem; padding:0; text-decoration:underline; }
  .link:disabled { opacity:.3; }
  h2 { font-size:1rem; font-weight:500; margin:0 0 .6rem; color:var(--dim); }
  .bar { height:.5rem; background:var(--line); border-radius:99px; overflow:hidden; }
  .bar > div { height:100%; width:0; background:var(--fg); }
  .between { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; margin-top:.6rem; }
  .goal { display:flex; align-items:center; gap:.5rem; color:var(--dim); font-size:.9rem; }
  .goal input { width:4.5rem; background:#000; border:1px solid var(--line); border-radius:.5rem; padding:.3rem .5rem; text-align:right; }
  .row { display:flex; justify-content:space-between; gap:1rem; padding:.55rem 0; border-bottom:1px solid var(--line); }
  .row small { color:var(--dim); display:block; }
  .row .x { border:0; color:var(--dim); font-size:1.2rem; padding:0 .4rem; }
  .empty { color:var(--dim); font-size:.95rem; }
  .awake { display:flex; gap:.6rem; align-items:center; justify-content:center; color:var(--dim); font-size:.9rem; margin-top:-.75rem; }
  .awake input { width:1.1rem; height:1.1rem; accent-color:#f2f2f2; }
  .top { display:flex; justify-content:flex-end; margin-bottom:-1rem; }
  .plot { position:relative; height:8.5rem; display:flex; gap:.5rem; align-items:flex-end; }
  .col { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; }
  .col .val { font-size:.7rem; color:var(--dim); margin-bottom:.2rem; white-space:nowrap; }
  .col .b { width:100%; min-height:2px; background:#4a4a4a; border-radius:.3rem .3rem 0 0; }
  .col.today .b { background:var(--fg); }
  .goalline { position:absolute; left:0; right:0; border-top:1px dashed #777; pointer-events:none; }
  .days { display:flex; gap:.5rem; margin-top:.4rem; }
  .days span { flex:1; text-align:center; font-size:.75rem; color:var(--dim); }
  .legend { margin-top:.6rem; font-size:.8rem; color:var(--dim); }
</style>
</head>
<body>
<main>
  <div class="top"><button class="link" id="fs">Full screen</button></div>
  <div id="time">00:00:00</div>

  <div>
    <div id="chips"></div>
    <div class="between" style="justify-content:center">
      <button class="link" id="removeSub">Remove selected subject</button>
    </div>
  </div>

  <button id="toggle" class="start">Start</button>
  <label class="awake"><input type="checkbox" id="awake"> <span id="awakeText">Keep screen on while timing</span></label>

  <section>
    <h2>Today</h2>
    <div class="bar"><div id="fill"></div></div>
    <div class="between">
      <span id="todayText"></span>
      <strong id="streak"></strong>
    </div>
    <div class="between">
      <label class="goal" for="goal">Daily goal (minutes)</label>
      <span class="goal"><input id="goal" type="number" min="1" inputmode="numeric"></span>
    </div>
  </section>

  <section>
    <h2>Add subject</h2>
    <div class="add">
      <input id="newSub" type="text" maxlength="24" placeholder="e.g. Chemistry">
      <button id="addSub">Add</button>
    </div>
  </section>

  <section>
    <h2>This week</h2>
    <div id="chart"></div>
  </section>

  <section>
    <h2>Last 7 days by subject</h2>
    <div id="week"></div>
  </section>

  <section>
    <h2>History</h2>
    <div id="history"></div>
  </section>

  <section>
    <h2>Backup</h2>
    <div class="add">
      <button id="exp">Export backup</button>
      <button id="imp">Restore backup</button>
    </div>
    <input id="file" type="file" accept="application/json,.json" hidden>
    <div id="bkMsg" class="empty" style="margin-top:.6rem"></div>
    <button class="link" id="txtLink" style="margin-top:.6rem">Download didn't start?</button>
    <textarea id="txtBox" hidden readonly rows="5" style="width:100%;margin-top:.5rem;background:#000;color:#f2f2f2;border:1px solid #2a2a2a;border-radius:.6rem;padding:.6rem;font-size:.75rem"></textarea>
  </section>
</main>

<script>
(function () {
  var KEY = "studyTimerV2";
  var D = { sessions: [], subjects: ["Math", "Physics", "Reading"], subject: "Math",
            goalMin: 240, awake: true, lastBackup: 0, run: { on: false, startedAt: 0, subject: "" } };
  try {
    var s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.sessions)) D = Object.assign(D, s);
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} }

  function $(id) { return document.getElementById(id); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function h(tag, a, kids) {
    var e = document.createElement(tag); a = a || {};
    for (var k in a) {
      if (k === "text") e.textContent = a[k];
      else if (k === "disabled") e.disabled = !!a[k];
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), a[k]);
      else e.setAttribute(k, a[k]);
    }
    (kids || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }
  function clock(ms) {
    var s = Math.floor(ms / 1000);
    return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60);
  }
  function hm(ms) {
    if (ms < 60000) return Math.floor(ms / 1000) + "s";
    var hr = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000);
    return hr ? hr + "h " + m + "m" : m + "m";
  }
  function dayKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function elapsed() { return D.run.on ? Date.now() - D.run.startedAt : 0; }

  function totalsByDay() {
    var map = {};
    D.sessions.forEach(function (x) { var k = dayKey(x.start); map[k] = (map[k] || 0) + x.ms; });
    if (D.run.on) { var k2 = dayKey(D.run.startedAt); map[k2] = (map[k2] || 0) + elapsed(); }
    return map;
  }
  function streak(map) {
    var goal = D.goalMin * 60000, d = new Date(), n = 0;
    if ((map[dayKey(d.getTime())] || 0) < goal) d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
    while ((map[dayKey(d.getTime())] || 0) >= goal) {
      n++; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
    }
    return n;
  }

  var lastChartKey = "";
  function short(ms) {
    return ms >= 3600000 ? (ms / 3600000).toFixed(1) + "h" : Math.round(ms / 60000) + "m";
  }
  function renderChart(map) {
    var box = $("chart"); box.textContent = "";
    var goal = D.goalMin * 60000, now = new Date(), days = [], max = goal;
    for (var i = 6; i >= 0; i--) {
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      var ms = map[dayKey(d.getTime())] || 0;
      if (ms > max) max = ms;
      days.push({ d: d, ms: ms, today: i === 0 });
    }
    var plot = h("div", { "class": "plot" });
    plot.appendChild(h("div", { "class": "goalline", style: "bottom:" + (goal / max * 85) + "%" }));
    var labels = h("div", { "class": "days" });
    days.forEach(function (x) {
      plot.appendChild(h("div", { "class": "col" + (x.today ? " today" : "") }, [
        h("span", { "class": "val", text: x.ms >= 30000 ? short(x.ms) : "" }),
        h("div", { "class": "b", style: "height:" + (x.ms / max * 85) + "%" })
      ]));
      labels.appendChild(h("span", { text: x.d.toLocaleDateString([], { weekday: "short" }) }));
    });
    box.appendChild(plot);
    box.appendChild(labels);
    box.appendChild(h("div", { "class": "legend", text: "Dashed line is your daily goal." }));
  }

  // Keep the screen awake while a session is running
  var lock = null;
  function syncLock() {
    if (!("wakeLock" in navigator)) return;
    var want = D.run.on && D.awake && document.visibilityState === "visible";
    if (want && !lock) {
      navigator.wakeLock.request("screen").then(function (l) {
        lock = l; l.addEventListener("release", function () { lock = null; });
      }).catch(function () {});
    } else if (!want && lock) {
      lock.release().catch(function () {}); lock = null;
    }
  }

  function showBackup() {
    $("bkMsg").textContent = D.lastBackup
      ? "Last backup: " + new Date(D.lastBackup).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
      : "No backup yet. Export one so you never lose your history.";
  }
  function markBackup() { D.lastBackup = Date.now(); save(); showBackup(); }

  // Fast update: runs every 250 ms
  function tick() {
    var ms = elapsed(), map = totalsByDay(), goal = D.goalMin * 60000;
    var today = map[dayKey(Date.now())] || 0;
    $("time").textContent = clock(ms);
    document.title = (D.run.on ? "▶ " : "") + clock(ms) + " · Study timer";
    $("fill").style.width = Math.min(100, today / goal * 100) + "%";
    $("todayText").textContent = today >= goal ? hm(today) + " · goal reached" : hm(today) + " of " + hm(goal);
    var n = streak(map);
    $("streak").textContent = n + (n === 1 ? " day streak" : " day streak");
    var t = $("toggle");
    t.textContent = D.run.on ? "Stop" : "Start";
    t.className = D.run.on ? "stop" : "start";
    var ck = Math.floor(today / 60000) + ":" + D.goalMin + ":" + dayKey(Date.now());
    if (ck !== lastChartKey) { lastChartKey = ck; renderChart(map); }
  }

  // Slower rebuild: runs when something changes
  function renderLists() {
    lastChartKey = "";
    var box = $("chips"); box.textContent = "";
    var current = D.run.on ? D.run.subject : D.subject;
    D.subjects.forEach(function (name) {
      box.appendChild(h("button", {
        "class": "chip" + (name === current ? " on" : ""), text: name, disabled: D.run.on,
        onclick: function () { D.subject = name; save(); renderLists(); }
      }));
    });
    $("removeSub").disabled = D.run.on || D.subjects.length < 2;

    var d = new Date(), cut = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 6).getTime();
    var by = {};
    D.sessions.forEach(function (x) { if (x.start >= cut) by[x.subject] = (by[x.subject] || 0) + x.ms; });
    var names = Object.keys(by).sort(function (a, b) { return by[b] - by[a]; });
    var wk = $("week"); wk.textContent = "";
    if (!names.length) wk.appendChild(h("div", { "class": "empty", text: "Nothing yet. Start a session." }));
    names.forEach(function (n) {
      wk.appendChild(h("div", { "class": "row" }, [h("span", { text: n }), h("span", { text: hm(by[n]) })]));
    });

    var hist = $("history"); hist.textContent = "";
    if (!D.sessions.length) hist.appendChild(h("div", { "class": "empty", text: "Finished sessions show up here." }));
    D.sessions.slice().reverse().slice(0, 50).forEach(function (x) {
      var when = new Date(x.start).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      hist.appendChild(h("div", { "class": "row" }, [
        h("span", {}, [document.createTextNode(x.subject), h("small", { text: when })]),
        h("span", {}, [
          document.createTextNode(hm(x.ms)),
          h("button", { "class": "x", text: "×", "aria-label": "Delete session", onclick: function () {
            D.sessions = D.sessions.filter(function (y) { return y.id !== x.id; });
            save(); renderLists(); tick();
          } })
        ])
      ]));
    });
  }

  $("toggle").addEventListener("click", function () {
    if (D.run.on) {
      var ms = elapsed();
      if (ms >= 1000) D.sessions.push({ id: Date.now(), start: D.run.startedAt, ms: ms, subject: D.run.subject });
      D.run = { on: false, startedAt: 0, subject: "" };
    } else {
      D.run = { on: true, startedAt: Date.now(), subject: D.subject };
    }
    save(); renderLists(); tick(); syncLock();
  });

  function addSubject() {
    var v = $("newSub").value.trim();
    if (!v) return;
    if (D.subjects.indexOf(v) < 0) D.subjects.push(v);
    D.subject = v; $("newSub").value = "";
    save(); renderLists();
  }
  $("addSub").addEventListener("click", addSubject);
  $("newSub").addEventListener("keydown", function (e) { if (e.key === "Enter") addSubject(); });

  $("removeSub").addEventListener("click", function () {
    if (D.run.on || D.subjects.length < 2) return;
    D.subjects = D.subjects.filter(function (n) { return n !== D.subject; });
    D.subject = D.subjects[0];
    save(); renderLists();
  });

  $("goal").value = D.goalMin;
  $("goal").addEventListener("change", function () {
    var v = parseInt($("goal").value, 10);
    if (v > 0) D.goalMin = v; else $("goal").value = D.goalMin;
    save(); tick();
  });

  function backupJson() {
    return JSON.stringify({ sessions: D.sessions, subjects: D.subjects, goalMin: D.goalMin });
  }
  $("exp").addEventListener("click", function () {
    var name = "study-timer-backup-" + dayKey(Date.now()) + ".json";
    try {
      var url = URL.createObjectURL(new Blob([backupJson()], { type: "application/json" }));
      var a = document.createElement("a");
      a.href = url; a.download = name; a.style.display = "none";
      document.body.appendChild(a); a.click();
      setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 10000);
      markBackup();
      $("bkMsg").textContent = "Backup saved as " + name + ". Check your Downloads folder.";
    } catch (e) {
      $("bkMsg").textContent = "Download failed. Tap \"Download didn't start?\" below.";
    }
  });
  $("txtLink").addEventListener("click", function () {
    var t = $("txtBox");
    t.value = backupJson();
    t.hidden = !t.hidden;
    if (!t.hidden) {
      t.focus(); t.select();
      $("bkMsg").textContent = "Copy all of this text, save it in a file ending in .json, then use Restore backup.";
    }
  });
  $("imp").addEventListener("click", function () { $("file").click(); });
  $("file").addEventListener("change", function () {
    var f = $("file").files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var b = JSON.parse(r.result);
        if (!b || !Array.isArray(b.sessions)) throw 0;
        var have = {};
        D.sessions.forEach(function (x) { have[x.id] = 1; });
        var added = 0;
        b.sessions.forEach(function (x) { if (x && x.id && !have[x.id]) { D.sessions.push(x); added++; } });
        D.sessions.sort(function (a, c) { return a.start - c.start; });
        (b.subjects || []).forEach(function (n) { if (D.subjects.indexOf(n) < 0) D.subjects.push(n); });
        if (b.goalMin > 0) { D.goalMin = b.goalMin; $("goal").value = D.goalMin; }
        save(); renderLists(); tick();
        $("bkMsg").textContent = "Restored " + added + " new session" + (added === 1 ? "" : "s") + " from " + f.name + ".";
      } catch (e) { $("bkMsg").textContent = "That file isn't a valid backup."; }
    };
    r.readAsText(f); $("file").value = "";
  });

  if (D.subjects.indexOf(D.subject) < 0) D.subject = D.subjects[0];

  // Awake toggle
  var aw = $("awake");
  aw.checked = !!D.awake;
  if (!("wakeLock" in navigator)) {
    aw.disabled = true;
    $("awakeText").textContent = "Keep screen on isn't supported in this browser";
  }
  aw.addEventListener("change", function () { D.awake = aw.checked; save(); syncLock(); });

  // Full screen button
  var fsBtn = $("fs"), root = document.documentElement;
  if (!(root.requestFullscreen || root.webkitRequestFullscreen)) fsBtn.style.display = "none";
  function inFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function fsLabel() { fsBtn.textContent = inFs() ? "Exit full screen" : "Full screen"; }
  fsBtn.addEventListener("click", function () {
    try {
      if (inFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    } catch (e) {}
  });
  document.addEventListener("fullscreenchange", fsLabel);
  document.addEventListener("webkitfullscreenchange", fsLabel);

  // Ask the browser not to clear saved history
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}

  setInterval(tick, 250);
  document.addEventListener("visibilitychange", function () { tick(); syncLock(); });
  showBackup(); renderLists(); tick(); syncLock(); fsLabel();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
</script>
</body>
</html>
