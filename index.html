<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Study timer</title>
<style>
  :root { --fg:#f2f2f2; --dim:#8a8a8a; --line:#2a2a2a; --red:#e5484d; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; background:#000; color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:30rem; margin:0 auto; display:flex; flex-direction:column; gap:1.75rem;
    padding:calc(2rem + env(safe-area-inset-top)) 1.25rem calc(2.5rem + env(safe-area-inset-bottom)); }
  #time { font-size:clamp(3.5rem,19vw,6rem); font-weight:200; text-align:center;
    font-variant-numeric:tabular-nums; letter-spacing:.02em; line-height:1; }
  #phase { text-align:center; color:var(--dim); min-height:1.2em; margin-top:-1.1rem; }
  button, input, select { font:inherit; color:var(--fg); }
  button { cursor:pointer; background:transparent; border:1px solid #555; border-radius:999px; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
  #toggle { width:100%; padding:1rem; font-size:1.2rem; }
  #toggle.start { background:var(--fg); color:#000; border-color:var(--fg); }
  #toggle.stop { border-color:var(--red); color:var(--red); }
  #chips, .mode { display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center; }
  .chip { padding:.45rem 1rem; font-size:.95rem; }
  .chip.on { background:var(--fg); color:#000; border-color:var(--fg); }
  .chip:disabled:not(.on) { opacity:.3; }
  .chip.on:disabled { opacity:1; }
  .add { display:flex; gap:.5rem; align-items:center; }
  .add input { flex:1; min-width:0; }
  .fld, .add input { width:100%; min-width:0; background:#000; border:1px solid var(--line); border-radius:.6rem;
    padding:.6rem .8rem; color-scheme:dark; }
  .add button { padding:.5rem 1rem; }
  .link { border:0; color:var(--dim); font-size:.85rem; padding:0; text-decoration:underline; }
  .link:disabled { opacity:.3; }
  h2 { font-size:1rem; font-weight:500; margin:0 0 .6rem; color:var(--dim); }
  .bar { height:.5rem; background:var(--line); border-radius:99px; overflow:hidden; }
  .bar > div { height:100%; width:0; background:var(--fg); }
  .between { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; margin-top:.6rem; }
  .goal, .pomo { display:flex; align-items:center; gap:.5rem; color:var(--dim); font-size:.9rem; }
  .pomo { justify-content:center; gap:1.25rem; flex-wrap:wrap; }
  .pomo label { display:flex; align-items:center; gap:.4rem; }
  .goal input, .pomo input { width:4.5rem; background:#000; border:1px solid var(--line); border-radius:.5rem;
    padding:.3rem .5rem; text-align:right; }
  .row { display:flex; justify-content:space-between; gap:1rem; padding:.55rem 0; border-bottom:1px solid var(--line); }
  .row small { color:var(--dim); display:block; }
  .row .grow { min-width:0; overflow-wrap:anywhere; }
  .row .act { display:flex; align-items:center; gap:.6rem; white-space:nowrap; }
  .row .x { border:0; color:var(--dim); font-size:1.2rem; padding:0 .2rem; }
  .empty { color:var(--dim); font-size:.95rem; }
  .awake { display:flex; gap:.6rem; align-items:center; justify-content:center; color:var(--dim); font-size:.9rem; margin-top:-.75rem; }
  .awake + .awake { margin-top:-1.25rem; }
  .awake input { width:1.1rem; height:1.1rem; accent-color:#f2f2f2; }
  .top { display:flex; justify-content:flex-end; margin-bottom:-1rem; }
  .plot { position:relative; height:8.5rem; display:flex; gap:.5rem; align-items:flex-end; }
  .col { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; }
  .col .val { font-size:.7rem; color:var(--dim); margin-bottom:.2rem; white-space:nowrap; }
  .col .b { width:100%; min-height:2px; background:#4a4a4a; border-radius:.3rem .3rem 0 0; }
  .col.today .b { background:var(--fg); }
  .goalline { position:absolute; left:0; right:0; border-top:1px dashed #777; pointer-events:none; }
  .days { display:flex; gap:.5rem; margin-top:.4rem; }
  .days span { flex:1; text-align:center; font-size:.75rem; color:var(--dim); }
  .legend { margin-top:.6rem; font-size:.8rem; color:var(--dim); }
  .mhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:.7rem; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:.3rem; }
  .cal .wd { text-align:center; font-size:.7rem; color:var(--dim); }
  .cell { aspect-ratio:1; padding:0; border-radius:.4rem; border:1px solid transparent; font-size:.8rem; background:#141414; color:var(--dim); }
  .cell.l1 { background:#2c2c2c; color:var(--fg); }
  .cell.l2 { background:#6a6a6a; color:#fff; }
  .cell.l3 { background:var(--fg); color:#000; }
  .cell.today { border-color:var(--fg); }
  .cell.sel { outline:2px dashed var(--fg); outline-offset:1px; }
  .form { display:flex; flex-direction:column; gap:.6rem; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
  .note { color:#b5b5b5 !important; }
  @media (orientation:landscape) and (max-height:520px) {
    main { max-width:44rem; padding-top:1rem; gap:1.25rem; }
    #time { font-size:clamp(3rem,22vh,5.5rem); }
  }
  .sheet { background:#fff; color:#222; border-radius:.6rem; overflow:hidden; padding-bottom:.6rem; }
  .sheet h3 { background:#666; color:#fff; margin:0; padding:.8rem 1rem; font-size:1.15rem; text-align:center; }
  .srow { display:flex; justify-content:space-around; padding:.8rem .4rem 0; }
  .donut { text-align:center; font-size:.9rem; }
  .donut small { display:block; color:#777; font-size:.7rem; }
  .scroll { overflow-x:auto; padding:.5rem 0; }
  .sh { border-collapse:collapse; font-size:.85rem; white-space:nowrap; }
  .sh th { background:#8fcfa9; color:#1d3a2b; padding:.45rem .5rem; font-weight:600; border:1px solid #fff; }
  .sh td { padding:.2rem .25rem; text-align:center; border:1px solid #eee; min-width:1.9rem; }
  .sh .prog { background:#cdeadb; min-width:3.6rem; }
  .sh .alt { background:#f3f3f3; }
  .sh .first { position:sticky; left:0; background:#fff; min-width:9.5rem; text-align:left; z-index:1; }
  .sh .alt .first { background:#f3f3f3; }
  .sh th.first { background:#8fcfa9; text-align:center; }
  .sh td.tdy { background:#e4f4ea; }
  .nmw { display:flex; align-items:center; gap:.2rem; }
  .sh input[type=checkbox] { width:1.2rem; height:1.2rem; accent-color:#2a9d63; margin:0; }
  .sh input.nm { flex:1; min-width:0; border:0; background:transparent; color:#222; font:inherit; padding:.3rem .4rem; }
  .sh input.add { color:#2a7a52; }
  .sh input.tg { width:2.6rem; border:1px solid #ccc; border-radius:.3rem; background:#fff; color:#222; text-align:center; padding:.15rem; }
  .sh .x { border:0; color:#999; padding:0 .3rem; }
  [hidden] { display:none !important; }
  .tabs { position:sticky; top:0; z-index:5; background:#000; display:flex; justify-content:center; gap:.6rem;
    padding:calc(.6rem + env(safe-area-inset-top)) 1rem .6rem; border-bottom:1px solid var(--line); }
  .tabs button { padding:.45rem 1.4rem; font-size:.95rem; }
  .tabs button.on { background:var(--fg); color:#000; border-color:var(--fg); }
  #paneTimer, #paneGoals { padding-top:1.25rem; }
  #paneGoals { max-width:64rem; }
  #paneGoals .donut svg { width:150px; height:150px; }
  #paneGoals .sheet { padding-bottom:1rem; }
</style>
</head>
<body>
<nav class="tabs" role="tablist">
  <button id="tabTimer" class="on" role="tab" aria-selected="true">Timer</button>
  <button id="tabGoals" role="tab" aria-selected="false">Goals</button>
</nav>
<main id="paneTimer">
  <div class="top"><button class="link" id="fs">Full screen</button></div>
  <div id="time">00:00:00</div>
  <div id="phase"></div>

  <div class="mode" id="modeBox">
    <button data-m="stopwatch">Stopwatch</button>
    <button data-m="pomodoro">Pomodoro</button>
  </div>
  <div class="pomo" id="pomoSet" hidden>
    <label>Focus <input id="focusMin" type="number" min="1" max="180" inputmode="numeric"> min</label>
    <label>Break <input id="breakMin" type="number" min="1" max="60" inputmode="numeric"> min</label>
  </div>

  <div>
    <div id="chips"></div>
    <div class="between" style="justify-content:center">
      <button class="link" id="removeSub">Remove selected subject</button>
    </div>
  </div>

  <input id="liveNote" class="fld" type="text" maxlength="120" placeholder="Note for this session (optional)">

  <button id="toggle" class="start">Start</button>
  <label class="awake"><input type="checkbox" id="awake"> <span id="awakeText">Keep screen on while timing</span></label>
  <label class="awake"><input type="checkbox" id="alerts"> <span>Sound and notification alerts</span></label>

  <section>
    <h2>Today</h2>
    <div class="bar"><div id="fill"></div></div>
    <div class="between">
      <span id="todayText"></span>
      <strong id="streak"></strong>
    </div>
    <div class="between">
      <label class="goal" for="goal">Daily goal (minutes)</label>
      <span class="goal"><input id="goal" type="number" min="1" inputmode="numeric"></span>
    </div>
  </section>

  <section>
    <h2>This week</h2>
    <div id="chart"></div>
  </section>

  <section>
    <h2>Month</h2>
    <div id="month"></div>
  </section>

  <section>
    <h2>Add subject</h2>
    <div class="add">
      <input id="newSub" type="text" maxlength="24" placeholder="e.g. Chemistry">
      <button id="addSub">Add</button>
    </div>
  </section>

  <section>
    <h2>Last 7 days by subject</h2>
    <div id="week"></div>
  </section>

  <section id="formSec">
    <h2 id="formTitle">Add a session manually</h2>
    <div class="form">
      <select id="mSubject" class="fld" aria-label="Subject"></select>
      <div class="two">
        <input id="mDate" type="date" class="fld" aria-label="Date">
        <input id="mTime" type="time" class="fld" aria-label="Start time">
      </div>
      <div class="two">
        <input id="mDur" type="number" min="1" max="1440" inputmode="numeric" placeholder="Minutes" class="fld" aria-label="Minutes">
        <input id="mNote" type="text" maxlength="120" placeholder="Note (optional)" class="fld" aria-label="Note">
      </div>
      <div class="add">
        <button id="mSave">Add session</button>
        <button class="link" id="mCancel" hidden>Cancel edit</button>
      </div>
      <div id="mMsg" class="empty"></div>
    </div>
  </section>

  <section>
    <h2>History</h2>
    <div id="history"></div>
    <button class="link" id="more" style="margin-top:.8rem" hidden>Show more</button>
  </section>

  <section>
    <h2>Backup</h2>
    <div class="add">
      <button id="exp">Export backup</button>
      <button id="imp">Restore backup</button>
      <button id="csv">Export CSV</button>
    </div>
    <input id="file" type="file" accept="application/json,.json" hidden>
    <div id="bkMsg" class="empty" style="margin-top:.6rem"></div>
    <button class="link" id="txtLink" style="margin-top:.6rem">Download didn't start?</button>
    <textarea id="txtBox" hidden readonly rows="5" style="width:100%;margin-top:.5rem;background:#000;color:#f2f2f2;border:1px solid #2a2a2a;border-radius:.6rem;padding:.6rem;font-size:.75rem"></textarea>
  </section>
</main>
<main id="paneGoals" hidden>
  <section>
    <div class="between" style="margin:0 0 .6rem"><button class="link" id="gPrev">‹ Prev</button><strong id="gTitle"></strong><button class="link" id="gNext">Next ›</button></div>
    <div class="sheet">
      <h3 id="sTitle"></h3>
      <div class="srow"><div id="dDonut"></div><div id="wDonut"></div></div>
      <div class="scroll" id="dChart"></div>
      <div class="scroll" id="dTable"></div>
      <div class="scroll" id="wTable"></div>
      <div class="scroll" id="wChart"></div>
    </div>
    <div class="empty" style="margin-top:.6rem">Type in the last row of a table to add a goal. Tap a name or target to edit it.</div>
  </section>

</main>

<script>
(function () {
  var KEY = "studyTimerV2";
  function idle() {
    return { on: false, startedAt: 0, subject: "", mode: "stopwatch", phase: "", phaseStart: 0, focusMs: 0, breakMs: 0 };
  }
  var D = {
    sessions: [], subjects: ["Math", "Physics", "Reading"], subject: "Math", goalMin: 240,
    awake: true, alerts: true, lastBackup: 0, goalAlertDay: "", mode: "stopwatch",
    focusMin: 25, breakMin: 5, note: "", run: idle()
  };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && Array.isArray(saved.sessions)) D = Object.assign(D, saved);
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} }

  function $(id) { return document.getElementById(id); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function uid() { return Math.round(Date.now() * 1000 + Math.random() * 1000); }
  function h(tag, a, kids) {
    var e = document.createElement(tag); a = a || {};
    for (var k in a) {
      if (k === "text") e.textContent = a[k];
      else if (k === "disabled") e.disabled = !!a[k];
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), a[k]);
      else e.setAttribute(k, a[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function clock(ms) {
    var s = Math.floor(ms / 1000);
    return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60);
  }
  function hm(ms) {
    if (ms < 60000) return Math.floor(ms / 1000) + "s";
    var hr = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000);
    return hr ? hr + "h " + m + "m" : m + "m";
  }
  function short(ms) { return ms >= 3600000 ? (ms / 3600000).toFixed(1) + "h" : Math.round(ms / 60000) + "m"; }
  function dayKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function hhmm(ts) { var d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function curMode() { return D.run.on ? (D.run.mode || "stopwatch") : D.mode; }

  // ---- What is counting right now ----
  function live(now) {
    var r = D.run;
    if (!r.on) return { ms: 0, start: 0 };
    if (r.mode === "pomodoro") return r.phase === "focus" ? { ms: now - r.phaseStart, start: r.phaseStart } : { ms: 0, start: 0 };
    return { ms: now - r.startedAt, start: r.startedAt };
  }
  function shownMs(now) {
    var r = D.run;
    if (!r.on) return D.mode === "pomodoro" ? D.focusMin * 60000 : 0;
    if (r.mode === "pomodoro") return Math.max(0, r.phaseStart + (r.phase === "focus" ? r.focusMs : r.breakMs) - now);
    return now - r.startedAt;
  }
  function totalsByDay(now) {
    var map = {}, L = live(now);
    D.sessions.forEach(function (x) { var k = dayKey(x.start); map[k] = (map[k] || 0) + x.ms; });
    if (L.ms > 0) { var k2 = dayKey(L.start); map[k2] = (map[k2] || 0) + L.ms; }
    return map;
  }
  function streak(map) {
    var goal = D.goalMin * 60000, d = new Date(), n = 0;
    if ((map[dayKey(d.getTime())] || 0) < goal) d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
    while ((map[dayKey(d.getTime())] || 0) >= goal) {
      n++; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
    }
    return n;
  }

  // Pomodoro: move through focus/break phases, even if the app was asleep for a while
  function advance(now) {
    var r = D.run, last = null;
    if (!r.on || r.mode !== "pomodoro" || !(r.focusMs > 0) || !(r.breakMs > 0)) return null;
    while (true) {
      var end = r.phaseStart + (r.phase === "focus" ? r.focusMs : r.breakMs);
      if (now < end) break;
      if (r.phase === "focus") {
        D.sessions.push({ id: uid(), start: r.phaseStart, ms: r.focusMs, subject: r.subject, note: D.note, kind: "pomodoro" });
        r.phase = "break"; last = { ev: "focusDone", end: end };
      } else {
        r.phase = "focus"; last = { ev: "breakDone", end: end };
      }
      r.phaseStart = end;
    }
    if (last) save();
    return last;
  }

  // ---- Alerts: sound, vibration, notification ----
  var actx = null;
  function unlockAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!actx && AC) actx = new AC();
      if (actx && actx.state === "suspended") actx.resume();
    } catch (e) {}
  }
  function beep(n) {
    if (!actx) return;
    try {
      for (var i = 0; i < n; i++) {
        var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.35;
        o.type = "sine"; o.frequency.value = 880;
        o.connect(g); g.connect(actx.destination);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
        o.start(t); o.stop(t + 0.3);
      }
    } catch (e) {}
  }
  function askNotify() {
    try { if (D.alerts && window.Notification && Notification.permission === "default") Notification.requestPermission(); } catch (e) {}
  }
  function alertUser(title, body) {
    if (!D.alerts) return;
    beep(3);
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
    try {
      if (window.Notification && Notification.permission === "granted") {
        if (navigator.serviceWorker && navigator.serviceWorker.ready) {
          navigator.serviceWorker.ready.then(function (reg) {
            reg.showNotification(title, { body: body, icon: "icon-192.png", tag: "study-timer" });
          }).catch(function () {});
        } else { new Notification(title, { body: body }); }
      }
    } catch (e) {}
  }
  function notifyPhase(ev) {
    if (ev === "focusDone") alertUser("Focus session done", "Take a " + Math.round(D.run.breakMs / 60000) + " minute break.");
    else alertUser("Break over", "Time to focus.");
  }

  // ---- Keep screen awake ----
  var lock = null;
  function syncLock() {
    if (!("wakeLock" in navigator)) return;
    var want = D.run.on && D.awake && document.visibilityState === "visible";
    if (want && !lock) {
      navigator.wakeLock.request("screen").then(function (l) {
        lock = l; l.addEventListener("release", function () { lock = null; });
      }).catch(function () {});
    } else if (!want && lock) { lock.release().catch(function () {}); lock = null; }
  }

  // ---- Week chart ----
  var lastChartKey = "", lastToday = null;
  function renderChart(map) {
    var box = $("chart"); box.textContent = "";
    var goal = D.goalMin * 60000, now = new Date(), days = [], max = goal;
    for (var i = 6; i >= 0; i--) {
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      var ms = map[dayKey(d.getTime())] || 0;
      if (ms > max) max = ms;
      days.push({ d: d, ms: ms, today: i === 0 });
    }
    var plot = h("div", { "class": "plot" });
    plot.appendChild(h("div", { "class": "goalline", style: "bottom:" + (goal / max * 85) + "%" }));
    var labels = h("div", { "class": "days" });
    days.forEach(function (x) {
      plot.appendChild(h("div", { "class": "col" + (x.today ? " today" : "") }, [
        h("span", { "class": "val", text: x.ms >= 30000 ? short(x.ms) : "" }),
        h("div", { "class": "b", style: "height:" + (x.ms / max * 85) + "%" })
      ]));
      labels.appendChild(h("span", { text: x.d.toLocaleDateString([], { weekday: "short" }) }));
    });
    box.appendChild(plot); box.appendChild(labels);
    box.appendChild(h("div", { "class": "legend", text: "Dashed line is your daily goal." }));
  }

  // ---- Month calendar ----
  var monthOff = 0, selDay = null;
  function refreshMonth() { renderMonth(totalsByDay(Date.now())); }
  function renderMonth(map) {
    var box = $("month"); box.textContent = "";
    var now = new Date(), first = new Date(now.getFullYear(), now.getMonth() + monthOff, 1);
    var y = first.getFullYear(), m = first.getMonth(), n = new Date(y, m + 1, 0).getDate();
    var goal = D.goalMin * 60000, total = 0, studied = 0, todayKey = dayKey(Date.now());
    var cal = h("div", { "class": "cal" }), i;
    ["M", "T", "W", "T", "F", "S", "S"].forEach(function (w) { cal.appendChild(h("div", { "class": "wd", text: w })); });
    for (i = 0; i < (first.getDay() + 6) % 7; i++) cal.appendChild(h("div"));
    for (i = 1; i <= n; i++) {
      (function (day) {
        var key = dayKey(new Date(y, m, day).getTime()), ms = map[key] || 0;
        total += ms; if (ms >= 60000) studied++;
        var lvl = ms < 60000 ? 0 : ms < goal / 2 ? 1 : ms < goal ? 2 : 3;
        cal.appendChild(h("button", {
          "class": "cell l" + lvl + (key === todayKey ? " today" : "") + (key === selDay ? " sel" : ""),
          text: String(day), onclick: function () { selDay = key; refreshMonth(); }
        }));
      })(i);
    }
    box.appendChild(h("div", { "class": "mhead" }, [
      h("button", { "class": "link", text: "‹ Previous", onclick: function () { monthOff--; selDay = null; refreshMonth(); } }),
      h("strong", { text: first.toLocaleDateString([], { month: "long", year: "numeric" }) }),

    var r = new FileReader();
    r.onload = function () {
      try {
        var b = JSON.parse(r.result);
        if (!b || !Array.isArray(b.sessions)) throw 0;
        var have = {}, added = 0;
        D.sessions.forEach(function (x) { have[x.id] = 1; });
        b.sessions.forEach(function (x) { if (x && x.id && !have[x.id]) { D.sessions.push(x); added++; } });
        (b.goals || []).forEach(function (g) { if (g && g.id && !D.goals.some(function (y) { return y.id === g.id; })) D.goals.push(g); });
        Object.keys(b.checks || {}).forEach(function (k) { D.checks[k] = 1; });
        D.sessions.sort(function (a, c) { return a.start - c.start; });
        (b.subjects || []).forEach(function (n) { if (D.subjects.indexOf(n) < 0) D.subjects.push(n); });
        if (b.goalMin > 0) { D.goalMin = b.goalMin; $("goal").value = D.goalMin; }
        save(); renderLists(); tick();
        $("bkMsg").textContent = "Restored " + added + " new session" + (added === 1 ? "" : "s") + " from " + f.name + ".";
      } catch (e) { $("bkMsg").textContent = "That file isn't a valid backup."; }
    };
    r.readAsText(f); $("file").value = "";
  });

  // ---- Screen awake, alerts toggle, full screen, storage ----
  var aw = $("awake");
  aw.checked = !!D.awake;
  if (!("wakeLock" in navigator)) {
    aw.disabled = true;
    $("awakeText").textContent = "Keep screen on isn't supported in this browser";
  }
  aw.addEventListener("change", function () { D.awake = aw.checked; save(); syncLock(); });

  $("alerts").checked = !!D.alerts;
  $("alerts").addEventListener("change", function () {
    D.alerts = this.checked; save();
    if (D.alerts) { unlockAudio(); askNotify(); beep(1); }
  });

  var fsBtn = $("fs"), root = document.documentElement;
  if (!(root.requestFullscreen || root.webkitRequestFullscreen)) fsBtn.style.display = "none";
  function inFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function fsLabel() { fsBtn.textContent = inFs() ? "Exit full screen" : "Full screen"; }
  fsBtn.addEventListener("click", function () {
    try {
      if (inFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    } catch (e) {}
  });
  document.addEventListener("fullscreenchange", fsLabel);
  document.addEventListener("webkitfullscreenchange", fsLabel);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
  document.addEventListener("pointerdown", unlockAudio, { passive: true });

  if (D.subjects.indexOf(D.subject) < 0) D.subject = D.subjects[0];
  setInterval(tick, 250);
  document.addEventListener("visibilitychange", function () { tick(); syncLock(); });
  showBackup(); resetForm(); renderLists(); tick(); syncLock(); fsLabel();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
</script>
</body>
</html>
